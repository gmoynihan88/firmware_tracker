version: 2
updates:
  # The scrapers parse vendor-controlled input through aiohttp, lxml, BeautifulSoup
  # and Chromium. Dependencies are declared as floors, so CI already installs the
  # newest of each; these PRs raise the floors, and the audit job in ci.yml is what
  # catches a known vulnerability in whatever actually installs.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
