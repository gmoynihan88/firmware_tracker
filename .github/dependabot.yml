version: 2
updates:
  # The scrapers parse vendor-controlled input through aiohttp, lxml, BeautifulSoup
  # and Chromium. What installs is the hashed lock files, which Dependabot
  # regenerates with pip-compile from requirements.in and requirements-dev.in --
  # it only recompiles from .in files, never from pyproject.toml, which is why they
  # exist. The audit job in ci.yml checks the pins for known vulnerabilities.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
