name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a full commit SHA, with its release as a comment that
# Dependabot updates alongside the SHA. A tag like @v7 can be repointed by whoever
# controls the action's repository -- how the tj-actions/changed-files compromise
# reached thousands of repos in March 2025 -- and a commit cannot.
#
# The token is read-only here rather than by the repository default, which a
# settings change could widen without anything showing up in review. Checkout is
# told not to persist it into .git/config, where any later step could read it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The browser extra is deliberately omitted: Playwright is optional and
      # guarded by PLAYWRIGHT_AVAILABLE, and no test exercises fetch_page_js().
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  coverage:
    # One version rather than the matrix. Line counts can differ slightly between
    # interpreters, and a threshold that passes on 3.13 and fails on 3.11 would make
    # the gate look flaky rather than meaningful.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # concurrency = ["greenlet", "thread"] in pyproject is what makes these numbers
      # real. SQLAlchemy bridges async to the sync DBAPI through greenlets, and
      # without it coverage stops tracing at each handler's first `await` into the
      # database -- which understated the API and web layers by around 35 points.
      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term

      # Two gates, because coverage means different things either side of the line.
      #
      # Application code is the half where a missing test is a real gap, and it sits
      # at 82%. The floor is set just below that: high enough to catch a regression,
      # not so high that it has to be renegotiated on every PR.
      - name: Coverage gate -- application code
        run: coverage report --omit='src/scrapers/plugins/*' --fail-under=80

      # Scrapers are verified against the live vendor site, not by coverage. The
      # Universal Audio scraper was reporting fabricated versions at a healthy-looking
      # 100%, so a passing test there proves much less than a scrape does. This floor
      # only exists to stop the plugin tests being deleted wholesale, and is set with
      # room for several new scrapers -- each one arrives with mostly-uncovered lines
      # and drags the total down about a point, and adding scrapers is the point of
      # the project.
      - name: Coverage gate -- whole project
        run: coverage report --fail-under=65

  audit:
    # Dependencies are floors rather than pins, so CI installs the newest release of
    # each and this audits exactly what was installed. The scrapers parse input the
    # vendors control, through aiohttp, lxml, BeautifulSoup and Chromium, so a known
    # vulnerability in one of those is a vulnerability in this app.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The browser extra is included here, unlike the test jobs: Playwright is
      # optional for the tests but not for the scrapers that need it. pip itself is
      # upgraded first so an old runner pip is not what fails the audit.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser]" pip-audit

      - name: Audit installed packages
        run: pip-audit --skip-editable --progress-spinner off
