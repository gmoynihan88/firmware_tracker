name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a full commit SHA, with its release as a comment that
# Dependabot updates alongside the SHA. A tag like @v7 can be repointed by whoever
# controls the action's repository -- how the tj-actions/changed-files compromise
# reached thousands of repos in March 2025 -- and a commit cannot.
#
# The token is read-only here rather than by the repository default, which a
# settings change could widen without anything showing up in review. Checkout is
# told not to persist it into .git/config, where any later step could read it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image runs, and 3.13 is the newest release.
        python-version: ["3.12", "3.13"]
        # Coverage runs inside the 3.13 job. It used to be a job of its own, which
        # ran the whole suite a second time on the interpreter this job already
        # covers -- the same result for another minute of runner time.
        include:
          - python-version: "3.13"
            coverage: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # From the hashed lock: pip refuses any file whose hash differs from the one
      # reviewed in requirements-dev.txt. The project itself is not installed -- tests
      # import `src` from the checkout -- so nothing is built and no build backend is
      # fetched unhashed. Playwright's Python package comes with the lock but its
      # browser does not, so the real-Chromium tests skip here.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Warm the import cache
        run: pytest -qq --collect-only

      # -n auto runs a worker per CPU, four on a hosted runner. Each worker is its own
      # process with its own in-memory test database, so tests cannot see each other's
      # rows; the suite and its coverage totals are identical to a serial run.
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: pytest -q -n auto

      # concurrency = ["greenlet", "thread"] in pyproject is what makes these numbers
      # real. SQLAlchemy bridges async to the sync DBAPI through greenlets, and
      # without it coverage stops tracing at each handler's first `await` into the
      # database -- which understated the API and web layers by around 35 points.
      #
      # One version rather than both. Line counts can differ slightly between
      # interpreters, and a threshold that passes on one and fails on the other would
      # make the gate look flaky rather than meaningful.
      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: pytest -q -n auto --cov=src --cov-report=term

      # Two gates, because coverage means different things either side of the line.
      #
      # Application code is the half where a missing test is a real gap, and it sits
      # at 82%. The floor is set just below that: high enough to catch a regression,
      # not so high that it has to be renegotiated on every PR.
      - name: Coverage gate -- application code
        if: ${{ matrix.coverage }}
        run: coverage report --omit='src/scrapers/plugins/*' --fail-under=80

      # Scrapers are verified against the live vendor site, not by coverage. The
      # Universal Audio scraper was reporting fabricated versions at a healthy-looking
      # 100%, so a passing test there proves much less than a scrape does. This floor
      # only exists to stop the plugin tests being deleted wholesale, and is set with
      # room for several new scrapers -- each one arrives with mostly-uncovered lines
      # and drags the total down about a point, and adding scrapers is the point of
      # the project.
      - name: Coverage gate -- whole project
        if: ${{ matrix.coverage }}
        run: coverage report --fail-under=65

  audit:
    # Audits the lock files, pin by pin: requirements.txt is exactly what the Docker
    # image installs and requirements-dev.txt is what CI runs. The scrapers parse
    # input the vendors control, through aiohttp, lxml, BeautifulSoup and Chromium, so
    # a known vulnerability in one of those is a vulnerability in this app.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # pip-audit itself comes from the hashed dev lock.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # --disable-pip audits the pinned versions as written, without resolving or
      # installing anything, so the result describes the lock files and not this
      # runner's environment.
      - name: Audit the lock files
        run: >-
          pip-audit --progress-spinner off --require-hashes --disable-pip
          -r requirements.txt -r requirements-dev.txt
